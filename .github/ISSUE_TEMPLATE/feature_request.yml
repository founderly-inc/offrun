name: Feature request
description: Suggest something Offrun should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, in your own words, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: system
    attributes:
      label: System you use
      multiple: true
      options:
        - Mac
        - Windows
        - Linux
